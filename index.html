<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>团队看板 · 请输入密码</title><style>body{background:#122a35;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:95vh;margin:0}main{background:#203d48;padding:40px;border-radius:18px;width:min(390px,80vw)}h1{font-size:25px}p{color:#b7cdd3;line-height:1.8}input,button{box-sizing:border-box;width:100%;padding:14px;border:0;border-radius:8px;font:inherit;margin:10px 0}button{background:#64dbb6;color:#123d34;font-weight:700;cursor:pointer}#error{color:#ffd086}</style><main><h1>◈ 矩阵雷达 · 团队查看</h1><p>输入团队共享密码后查看。无需注册账号。</p><form id="f"><input id="password" type="password" autocomplete="current-password" placeholder="输入共享密码" required><button id="submit">解锁看板</button></form><p id="error" role="status"></p></main><script>const meta={"salt":"paybB5Ce6CXF2QDZJ1Rirg==","iv":"BqwLl26PkvFHOGX+"};const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;b.textContent='正在验证…';try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(meta.salt),iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const r=await fetch('content.enc');if(!r.ok)throw Error('network');const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(meta.iv)},key,await r.arrayBuffer());const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(err){document.getElementById('error').textContent=err.message==='network'?'数据文件暂时无法加载，请稍后再试。':'密码不正确，或数据文件无法验证。';b.disabled=false;b.textContent='解锁看板'}};</script></html>
